def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'io.kirora.reactnative'
  compileSdk safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  kotlinOptions {
    jvmTarget = '11'
  }
}

// React Native's Gradle plugin (0.74 and later) raises every library to Java 17 and sets Kotlin's
// toolchain to match, unless the app sets react.internal.disableJavaVersionAlignment. A fixed Kotlin
// jvmTarget of 11 would then disagree with Java and fail with "Inconsistent JVM Target Compatibility",
// so Kotlin follows the Java level the module ends up with. This runs after the Android plugin has
// applied the app's and React Native's settings.
afterEvaluate {
  android.kotlinOptions.jvmTarget = android.compileOptions.targetCompatibility.toString()
}

repositories {
  google()
  mavenCentral()
  // Development: the Kirora Android SDK is published here by `./gradlew publishToMavenLocal`.
  mavenLocal()
}

def kiroraSdkVersion = safeExtGet('kiroraAndroidSdkVersion', '0.1.0')

dependencies {
  implementation 'com.facebook.react:react-android'
  // The core SDK, and the Firebase side of push (FCM service, notification permission).
  api "com.kirora:android-sdk:${kiroraSdkVersion}"
  implementation "com.kirora:android-sdk-push:${kiroraSdkVersion}"
}
